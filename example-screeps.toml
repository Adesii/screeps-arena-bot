default_deploy_mode = "pag"

[build]
build_mode = "arena"
out_name = "screeps-arena-bot"

[pag]
destination = "/Users/username/ScreepsArena"
prune = false
branch = "s4-pain_and_gain"
  [pag.build]
  extra_options = ["--no-default-features", "--features=s4-pain-and-gain"]

[ctf]
destination = "/Users/username/ScreepsArena"
prune = false
branch = "alpha-capture_the_flag"
  [ctf.build]
  extra_options = ["--no-default-features", "--features=arena-capture-the-flag"]

[swamp]
destination = "/Users/username/ScreepsArena"
prune = false
branch = "alpha-spawn_and_swamp"
  [swamp.build]
  extra_options = ["--no-default-features", "--features=arena-spawn-and-swamp"]

[collect]
destination = "/Users/username/ScreepsArena"
prune = false
branch = "alpha-collect_and_control"
  [collect.build]
  extra_options = ["--no-default-features", "--features=arena-collect-and-control"]

# for full syntax, see
# https://github.com/rustyscreeps/cargo-screeps/blob/master/screeps-defaults.toml